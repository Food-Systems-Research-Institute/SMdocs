format:
  html:
    page-layout: article 
    theme: custom_theme.scss # modified sandstone
    fig-align: left
    css: styles.css
    toc: true
    toc-title: "On This Page"
    toc-location: right
    toc-depth: 4
    number-sections: true
    number-depth: 4
    code-fold: true
    grid: 
      body-width: 900px
      sidebar-width: 250px
      margin-width: 250px
    mainfont: Roboto
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: true
    title-block-style: default

bibliography: fsrc.bib

execute:
  warning: false
  cache: true
  freeze: auto

editor_options:
  chunk_output_type: console
